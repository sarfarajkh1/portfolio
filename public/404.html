<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarfaraj Portfolio</title>
    <script>
      // SPA fallback: redirect 404s to index.html with the original URL preserved
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      }());
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/sarfaraj-portfolio-react/src/main.jsx"></script>
</body>
</html>
